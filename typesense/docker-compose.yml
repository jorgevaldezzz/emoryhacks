# Local Typesense for development. Production uses Typesense Cloud or your own
# host; only TYPESENSE_URL and the keys change.
#
#   docker compose up -d     # start
#   docker compose logs -f   # watch
#   docker compose down      # stop (data survives in ./data/typesense)
services:
  typesense:
    image: typesense/typesense:29.1
    container_name: emoryhacks-typesense
    restart: unless-stopped
    ports:
      - '8108:8108'
    volumes:
      - ./data/typesense:/data
    command: >
      --data-dir /data
      --api-key=${TYPESENSE_ADMIN_KEY:-dev-only-change-me}
      --enable-cors
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8108/health']
      interval: 10s
      timeout: 3s
      retries: 12
